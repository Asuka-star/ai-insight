spring:
  application:
    name: ai-insight
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ai_insight}
    username: ${POSTGRES_USER:ai_insight}
    password: ${POSTGRES_PASSWORD:ai_insight}
    driver-class-name: org.postgresql.Driver

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

ai-insight:
  llm:
    xiaomi:
      api-key: ${XIAOMI_LLM_API_KEY:}
      base-url: ${XIAOMI_LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      completions-path: ${XIAOMI_LLM_COMPLETIONS_PATH:/chat/completions}
      model: ${XIAOMI_LLM_MODEL:mimo-v2.5-pro}
      timeout: 60s
