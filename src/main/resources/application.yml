spring:
  application:
    name: ai-insight
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/ai_insight}
    username: ${POSTGRES_USER:ai_insight}
    password: ${POSTGRES_PASSWORD:ai_insight}
    driver-class-name: org.postgresql.Driver

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  charset:
    console: UTF-8
    file: UTF-8

ai-insight:
  http:
    proxy:
      enabled: ${AI_INSIGHT_PROXY_ENABLED:false}
      # Example: http://127.0.0.1:7890 or http://user:password@127.0.0.1:7890
      url: ${AI_INSIGHT_PROXY_URL:}
      host: ${AI_INSIGHT_PROXY_HOST:}
      port: ${AI_INSIGHT_PROXY_PORT:0}
      username: ${AI_INSIGHT_PROXY_USERNAME:}
      password: ${AI_INSIGHT_PROXY_PASSWORD:}
      non-proxy-hosts:
        - localhost
        - 127.0.0.1
        - ::1
  web-renderer:
    enabled: ${AI_INSIGHT_WEB_RENDERER_ENABLED:true}
    browser-channel: ${AI_INSIGHT_WEB_RENDERER_BROWSER_CHANNEL:msedge}
    headless: ${AI_INSIGHT_WEB_RENDERER_HEADLESS:true}
    navigation-timeout: ${AI_INSIGHT_WEB_RENDERER_NAVIGATION_TIMEOUT:15s}
    wait-after-load: ${AI_INSIGHT_WEB_RENDERER_WAIT_AFTER_LOAD:1s}
    max-html-length: ${AI_INSIGHT_WEB_RENDERER_MAX_HTML_LENGTH:2000000}
  llm:
    xiaomi:
      api-key: ${XIAOMI_LLM_API_KEY:}
      base-url: ${XIAOMI_LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      completions-path: ${XIAOMI_LLM_COMPLETIONS_PATH:/chat/completions}
      model: ${XIAOMI_LLM_MODEL:mimo-v2.5-pro}
      timeout: 60s
  search:
    tavily:
      api-key: ${TAVILY_API_KEY:}
      base-url: ${TAVILY_BASE_URL:https://api.tavily.com/search}
      max-results: ${TAVILY_MAX_RESULTS:5}
      search-depth: ${TAVILY_SEARCH_DEPTH:basic}
      include-raw-content: ${TAVILY_INCLUDE_RAW_CONTENT:true}
      timeout: 20s
