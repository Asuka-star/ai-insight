spring:
  application:
    name: ai-insight
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/ai_insight}
    username: ${POSTGRES_USER:ai_insight}
    password: ${POSTGRES_PASSWORD:ai_insight}
    driver-class-name: org.postgresql.Driver

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  charset:
    console: ${LOGGING_CHARSET_CONSOLE:UTF-8}
    file: ${LOGGING_CHARSET_FILE:UTF-8}

ai-insight:
  http:
    proxy:
      enabled: ${AI_INSIGHT_PROXY_ENABLED:false}
      # Example: http://127.0.0.1:7890 or http://user:password@127.0.0.1:7890
      url: ${AI_INSIGHT_PROXY_URL:}
      host: ${AI_INSIGHT_PROXY_HOST:}
      port: ${AI_INSIGHT_PROXY_PORT:0}
      username: ${AI_INSIGHT_PROXY_USERNAME:}
      password: ${AI_INSIGHT_PROXY_PASSWORD:}
      non-proxy-hosts:
        - localhost
        - 127.0.0.1
        - ::1
  web-renderer:
    enabled: ${AI_INSIGHT_WEB_RENDERER_ENABLED:true}
    browser-channel: ${AI_INSIGHT_WEB_RENDERER_BROWSER_CHANNEL:msedge}
    headless: ${AI_INSIGHT_WEB_RENDERER_HEADLESS:true}
    navigation-timeout: ${AI_INSIGHT_WEB_RENDERER_NAVIGATION_TIMEOUT:8s}
    wait-after-load: ${AI_INSIGHT_WEB_RENDERER_WAIT_AFTER_LOAD:250ms}
    max-html-length: ${AI_INSIGHT_WEB_RENDERER_MAX_HTML_LENGTH:2000000}
  llm:
    xiaomi:
      api-key: ${XIAOMI_LLM_API_KEY:}
      base-url: ${XIAOMI_LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      completions-path: ${XIAOMI_LLM_COMPLETIONS_PATH:/chat/completions}
      model: ${XIAOMI_LLM_MODEL:mimo-v2.5-pro}
      timeout: 60s
  embedding:
    api-key: ${AI_INSIGHT_EMBEDDING_API_KEY:}
    base-url: ${AI_INSIGHT_EMBEDDING_BASE_URL:https://api.openai.com/v1}
    embeddings-path: ${AI_INSIGHT_EMBEDDING_PATH:/embeddings}
    model: ${AI_INSIGHT_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${AI_INSIGHT_EMBEDDING_DIMENSIONS:0}
    max-batch-size: ${AI_INSIGHT_EMBEDDING_MAX_BATCH_SIZE:32}
    timeout: ${AI_INSIGHT_EMBEDDING_TIMEOUT:30s}
    cache-enabled: ${AI_INSIGHT_EMBEDDING_CACHE_ENABLED:true}
    cache-ttl: ${AI_INSIGHT_EMBEDDING_CACHE_TTL:P90D}
    cache-cleanup-interval-ms: ${AI_INSIGHT_EMBEDDING_CACHE_CLEANUP_INTERVAL_MS:86400000}
    cache-cleanup-initial-delay-ms: ${AI_INSIGHT_EMBEDDING_CACHE_CLEANUP_INITIAL_DELAY_MS:600000}
  search:
    tavily:
      api-key: ${TAVILY_API_KEY:}
      base-url: ${TAVILY_BASE_URL:https://api.tavily.com/search}
      max-results: ${TAVILY_MAX_RESULTS:5}
      search-depth: ${TAVILY_SEARCH_DEPTH:basic}
      include-raw-content: ${TAVILY_INCLUDE_RAW_CONTENT:false}
      timeout: 20s
  search-query-planner:
    max-search-queries: ${AI_INSIGHT_MAX_SEARCH_QUERIES:8}
    max-search-queries-per-competitor: ${AI_INSIGHT_MAX_SEARCH_QUERIES_PER_COMPETITOR:7}
  source-collection:
    max-results-per-query: ${AI_INSIGHT_SEARCH_MAX_RESULTS_PER_QUERY:2}
    min-search-sources: ${AI_INSIGHT_MIN_SEARCH_SOURCES:8}
    small-batch-search-sources-per-competitor: ${AI_INSIGHT_SEARCH_SOURCES_PER_COMPETITOR:3}
    large-batch-search-sources-per-competitor: ${AI_INSIGHT_LARGE_BATCH_SEARCH_SOURCES_PER_COMPETITOR:1}
    large-batch-competitor-threshold: ${AI_INSIGHT_LARGE_BATCH_COMPETITOR_THRESHOLD:12}
    hard-max-search-sources: ${AI_INSIGHT_HARD_MAX_SEARCH_SOURCES:24}
    max-parallel-batches: ${AI_INSIGHT_MAX_PARALLEL_SEARCH_BATCHES:8}
    max-parallel-searches: ${AI_INSIGHT_MAX_PARALLEL_SEARCHES:4}
    max-parallel-fetches: ${AI_INSIGHT_MAX_PARALLEL_FETCHES:8}
  workflow:
    max-review-rework-attempts: ${AI_INSIGHT_MAX_REVIEW_REWORK_ATTEMPTS:0}
